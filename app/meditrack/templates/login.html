{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="card login">
  <h1>{{ app_name }}</h1>
  <p class="muted">Hospital management system</p>

  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="primary wide">Sign in</button>
  </form>

  <p class="hint">
    Demo credentials: <code>admin</code> / <code>admin123</code><br>
    Change the password from the Account page after signing in.
  </p>
</div>
{% endblock %}
