[project]
name = "meditrack"
version = "0.1.0"
description = "A small hospital management system"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.120.1",
    "uvicorn==0.38.0",
    "jinja2==3.1.6",
    "sqlalchemy==2.0.44",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meditrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
