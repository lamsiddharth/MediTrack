# Presentation tier.
#
# Serves the built React bundle and reverse-proxies /api to the application
# tier. In the designed architecture those are two instances in two subnets;
# co-located here they are two containers, and this file is the same either
# way — only the upstream address changes.

upstream meditrack_api {
    # Resolved on the container network when co-located. In the two-subnet
    # deployment this becomes the application tier's fixed private IP.
    server ${API_UPSTREAM};
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # No DNS in this design, so there is no hostname to match on: the
    # instance is reached by its Elastic IP and this block answers for
    # anything.

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # the app caps attachments at 10m

    # --- API ------------------------------------------------------------
    location /api/ {
        proxy_pass http://meditrack_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The backend otherwise sees every request as coming from this proxy.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Attachment downloads answer 307 to a presigned S3 URL. That redirect
        # must reach the browser rather than being followed here, so that S3
        # serves the bytes directly instead of through this instance.
        proxy_redirect off;
    }

    location = /healthz {
        proxy_pass http://meditrack_api/healthz;
        access_log off;
    }

    # Answered by the proxy itself, so a health check can tell "edge up,
    # application down" from "nothing up".
    location = /nginx-health {
        access_log off;
        return 200 "frontend ok\n";
        add_header Content-Type text/plain;
    }

    # --- static assets --------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA routing ----------------------------------------------------
    # Any other path is a client-side route: serve the shell and let React
    # Router resolve it. Without this, a refresh on /patients returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
